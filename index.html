<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jyoti 🐸</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #050509;
        color: white;
    }

    /* =========================
       ANIMATED BACKGROUND
    ========================= */

    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 45%, #18182c 0%, #090914 35%, #030306 100%);
        z-index: -5;
    }

    .glow {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.25;
        animation: moveGlow 12s infinite alternate ease-in-out;
    }

    .glow.one {
        background: #7c3aed;
        left: -100px;
        top: -100px;
    }

    .glow.two {
        background: #2563eb;
        right: -100px;
        bottom: -100px;
        animation-delay: -5s;
    }

    .glow.three {
        background: #ec4899;
        left: 40%;
        top: 50%;
        width: 220px;
        height: 220px;
        animation-delay: -8s;
    }

    @keyframes moveGlow {
        0% {
            transform: translate(0, 0) scale(1);
        }

        50% {
            transform: translate(100px, -60px) scale(1.2);
        }

        100% {
            transform: translate(-80px, 80px) scale(0.9);
        }
    }

    /* Floating particles */

    .particles {
        position: absolute;
        inset: 0;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        opacity: 0.5;
        animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
        from {
            transform: translateY(110vh);
            opacity: 0;
        }

        20% {
            opacity: 0.7;
        }

        80% {
            opacity: 0.5;
        }

        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }

    /* =========================
       MAIN AREA
    ========================= */

    .container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .instruction {
        position: absolute;
        top: 20%;
        font-size: 15px;
        letter-spacing: 4px;
        color: rgba(255,255,255,0.8);
        text-transform: uppercase;
        animation: instructionPulse 2s infinite ease-in-out;
    }

    @keyframes instructionPulse {
        0%,100% {
            opacity: 0.45;
            transform: translateY(0);
        }

        50% {
            opacity: 1;
            transform: translateY(-5px);
        }
    }

    /* =========================
       GIFT
    ========================= */

    .gift-wrapper {
        position: relative;
        width: 220px;
        height: 220px;
        cursor: pointer;
        perspective: 800px;
    }

    .gift {
        position: absolute;
        width: 160px;
        height: 130px;
        left: 30px;
        top: 65px;
    }

    /* Gift body */

    .gift-body {
        position: absolute;
        width: 160px;
        height: 110px;
        bottom: 0;
        left: 0;
        border-radius: 5px;
        background: linear-gradient(135deg, #b91c1c, #ef4444, #991b1b);
        box-shadow:
            0 15px 35px rgba(0,0,0,0.5),
            inset 0 2px 5px rgba(255,255,255,0.2);
    }

    /* Vertical ribbon */

    .gift-body::before {
        content: "";
        position: absolute;
        left: 67px;
        top: 0;
        width: 27px;
        height: 100%;
        background: linear-gradient(
            90deg,
            #facc15,
            #fde68a,
            #eab308
        );
    }

    /* Gift lid */

    .lid {
        position: absolute;
        width: 180px;
        height: 35px;
        left: -10px;
        top: 0;
        border-radius: 5px;
        background: linear-gradient(135deg, #dc2626, #f87171, #b91c1c);
        box-shadow:
            0 10px 20px rgba(0,0,0,0.4),
            inset 0 2px 5px rgba(255,255,255,0.2);
        z-index: 5;

        transform-origin: left bottom;
        transition:
            transform 1s cubic-bezier(.2,.8,.2,1),
            top 1s cubic-bezier(.2,.8,.2,1);
    }

    /* Lid ribbon */

    .lid::before {
        content: "";
        position: absolute;
        left: 76px;
        top: 0;
        width: 27px;
        height: 35px;
        background: linear-gradient(
            90deg,
            #facc15,
            #fde68a,
            #eab308
        );
    }

    /* =========================
       BOW
    ========================= */

    .bow {
        position: absolute;
        top: -35px;
        left: 60px;
        width: 60px;
        height: 40px;
        z-index: 10;
        transition: transform 1s ease;
    }

    .bow-left,
    .bow-right {
        position: absolute;
        width: 35px;
        height: 28px;
        background: #facc15;
        border-radius: 70% 20% 70% 20%;
    }

    .bow-left {
        left: 0;
        transform: rotate(-25deg);
    }

    .bow-right {
        right: 0;
        transform: rotate(25deg) scaleX(-1);
    }

    .bow-center {
        position: absolute;
        width: 17px;
        height: 17px;
        background: #eab308;
        border-radius: 50%;
        left: 22px;
        top: 7px;
        z-index: 2;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -20%) scale(0);
        opacity: 0;
        white-space: nowrap;

        font-size: clamp(30px, 8vw, 75px);
        font-weight: 900;
        letter-spacing: 2px;

        background: linear-gradient(
            90deg,
            #fff,
            #f9a8d4,
            #c4b5fd,
            #fff
        );

        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        text-shadow:
            0 0 20px rgba(255,255,255,0.15);

        transition:
            transform 1.5s cubic-bezier(.16,1,.3,1),
            opacity 1s ease;

        animation: textGradient 4s linear infinite;

        z-index: 20;
        pointer-events: none;
    }

    @keyframes textGradient {
        to {
            background-position: 300% center;
        }
    }

    /* =========================
       OPEN STATE
    ========================= */

    .gift-wrapper.open .lid {
        transform: rotate(-32deg) translateY(-30px) translateX(-5px);
    }

    .gift-wrapper.open .bow {
        transform: translateY(-45px) rotate(-15deg);
    }

    .gift-wrapper.open .message {
        transform: translate(-50%, -100%) scale(1);
        opacity: 1;
    }

    .gift-wrapper.open {
        cursor: default;
    }

    /* Light coming from box */

    .light {
        position: absolute;
        width: 100px;
        height: 100px;
        left: 60px;
        top: 30px;
        border-radius: 50%;
        background: #fde68a;
        filter: blur(35px);
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 1;
    }

    .gift-wrapper.open .light {
        opacity: 0.7;
        animation: lightPulse 1.5s infinite alternate;
    }

    @keyframes lightPulse {
        from {
            transform: scale(0.8);
            opacity: 0.4;
        }

        to {
            transform: scale(1.3);
            opacity: 0.8;
        }
    }

    /* =========================
       SPARKLES
    ========================= */

    .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
    }

    .gift-wrapper.open .sparkle {
        animation: sparkleAnimation 1.8s ease-out forwards;
    }

    .sparkle:nth-child(1) {
        left: 10%;
        top: 20%;
    }

    .sparkle:nth-child(2) {
        right: 5%;
        top: 30%;
        animation-delay: .2s !important;
    }

    .sparkle:nth-child(3) {
        left: 20%;
        bottom: 10%;
        animation-delay: .4s !important;
    }

    .sparkle:nth-child(4) {
        right: 20%;
        bottom: 15%;
        animation-delay: .6s !important;
    }

    @keyframes sparkleAnimation {
        0% {
            opacity: 0;
            transform: scale(0);
        }

        30% {
            opacity: 1;
            transform: scale(1.5);
        }

        100% {
            opacity: 0;
            transform: translateY(-100px) scale(0);
        }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .instruction {
            top: 18%;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .gift-wrapper {
            transform: scale(0.85);
        }

        .message {
            font-size: 38px;
        }
    }

</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

    <div class="particles">

        <span class="particle" style="left:5%; animation-duration:9s;"></span>
        <span class="particle" style="left:12%; animation-duration:13s;"></span>
        <span class="particle" style="left:20%; animation-duration:11s;"></span>
        <span class="particle" style="left:28%; animation-duration:15s;"></span>
        <span class="particle" style="left:36%; animation-duration:10s;"></span>
        <span class="particle" style="left:45%; animation-duration:14s;"></span>
        <span class="particle" style="left:53%; animation-duration:12s;"></span>
        <span class="particle" style="left:61%; animation-duration:16s;"></span>
        <span class="particle" style="left:70%; animation-duration:10s;"></span>
        <span class="particle" style="left:78%; animation-duration:13s;"></span>
        <span class="particle" style="left:86%; animation-duration:11s;"></span>
        <span class="particle" style="left:94%; animation-duration:15s;"></span>

    </div>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">

    <div class="instruction">
        Click here please
    </div>


    <div class="gift-wrapper" id="gift">

        <!-- Light -->
        <div class="light"></div>


        <!-- Sparkles -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>


        <!-- Message -->
        <div class="message">
            JYOTI PAGLA 🐸
        </div>


        <!-- Gift -->
        <div class="gift">

            <!-- Bow -->
            <div class="bow">

                <div class="bow-left"></div>
                <div class="bow-right"></div>
                <div class="bow-center"></div>

            </div>


            <!-- Lid -->
            <div class="lid"></div>


            <!-- Body -->
            <div class="gift-body"></div>

        </div>

    </div>

</div>


<script>

    const gift = document.getElementById("gift");

    gift.addEventListener("click", function () {

        if (!gift.classList.contains("open")) {

            gift.classList.add("open");

        }

    });


    /* Create some extra random background particles */

    const particles = document.querySelector(".particles");

    for (let i = 0; i < 35; i++) {

        const p = document.createElement("span");

        p.classList.add("particle");

        p.style.left = Math.random() * 100 + "%";

        p.style.animationDuration =
            (8 + Math.random() * 12) + "s";

        p.style.animationDelay =
            (-Math.random() * 15) + "s";

        p.style.opacity =
            0.2 + Math.random() * 0.6;

        const size = 1 + Math.random() * 3;

        p.style.width = size + "px";
        p.style.height = size + "px";

        particles.appendChild(p);
    }

</script>

</body>
</html>
